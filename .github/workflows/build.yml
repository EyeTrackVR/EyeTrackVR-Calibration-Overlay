name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]  # publishes a release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `release` builds are published as EyeTrackVR-Overlay-<openvr>.tar.xz.
          - name: Linux x64
            os: ubuntu-24.04
            openvr: linux64
            release: true
          - name: Linux arm64
            os: ubuntu-24.04-arm
            openvr: linuxarm64
            release: true
          - name: Windows x64
            os: windows-2025
            openvr: win64
            release: true
            cmake-args: -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          - name: Linux x64 sanitizers
            os: ubuntu-24.04
            openvr: linux64
            cmake-args: -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
    defaults:
      run:
        shell: bash
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/fetch-openvr.sh ${{ matrix.openvr }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -q -y --no-install-recommends libopenxr-dev libvulkan-dev libstb-dev
      - if: runner.os == 'Windows'
        # Tag builds can only restore caches saved on main, never ones from PRs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
      - if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: vcpkg.json
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.cmake-args }}
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure --parallel
      - if: matrix.release
        run: |
          cmake --install build --config Release --prefix package
          tar -cJf "EyeTrackVR-Overlay-$OPENVR.tar.xz" -C package .
        env:
          OPENVR: ${{ matrix.openvr }}
      - if: matrix.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EyeTrackVR-Overlay-${{ matrix.openvr }}
          path: EyeTrackVR-Overlay-${{ matrix.openvr }}.tar.xz

  release:
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # Verify with: gh attestation verify <asset> -R EyeTrackVR/EyeTrackVR-Calibration-Overlay
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: EyeTrackVR-Overlay-*
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes EyeTrackVR-Overlay-*
        env:
          GH_TOKEN: ${{ github.token }}

  # The one check for branch protection to require.
  all-checks:
    name: Build passed
    if: always()
    needs: [build]
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
