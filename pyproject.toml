# Pinned lint tools for CI and local use: `uv run <tool>`.
[project]
name = "eyetrackvr-overlay-tools"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "clang-format==23.1.3",
    "clang-tidy==23.1.4",
    "ruff==0.17.3",
    "shellcheck-py==0.11.0.1",
    "zizmor==1.31.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = ["external"]
